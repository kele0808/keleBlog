baseURL = "https://kele0808.github.io/keleBlog/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "keleBlog"
theme = "PaperMod"

enableRobotsTXT = true
enableGitInfo = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[frontmatter]
lastmod = [":git", "lastmod", "date", "publishDate"]

[minify]
disableXML = true
minifyOutput = true

[minify.tdewolff.html]
keepWhitespace = true

# ---------- 语言无关的全局参数 ----------
[params]
env = "production"
author = "kele"

[params.label]
text = "keleBlog"
icon = "favicon.svg"
iconHeight = 28
mainSections = ["posts"]
keywords = ["Java", "Kafka", "分布式系统", "机器学习", "RAG", "Agent", "Agent Infra", "源码解析"]
images = ["images/og.png"]
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = true
comments = true
hidemeta = false
hideSummary = false
ShowToc = true
TocOpen = true

[[params.socialIcons]]
name = "github"
url = "https://github.com/kele0808"

[params.assets]
disableHLJS = true
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"
safari_pinned_tab = "safari-pinned-tab.svg"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

# ---------- 语言与站点 ----------
[languages]

[languages.zh-cn]
languageName = "中文"
languageCode = "zh-cn"
weight = 1
title = "keleBlog"

  [languages.zh-cn.params]
  description = "kele 的技术博客：Java 后端与分布式系统出发，深入 LLM、RAG、Agent 与 Agent Infra。"

    [languages.zh-cn.params.homeInfoParams]
    Title = "Hi, 我是 kele 👋"
    Role = "从 Java 后端与分布式系统出发，探索 LLM、RAG 与 Agent 工程。"
    Content = "通过源码阅读、可复现实验和项目实践，记录技术理解与设计取舍。"
    Now = "RAGForge 混合检索（向量 + 全文 + RRF）· Kafka Producer 源码"

      [[languages.zh-cn.params.homeInfoParams.Buttons]]
      name = "项目"
      url = "/projects/"
      primary = true

      [[languages.zh-cn.params.homeInfoParams.Buttons]]
      name = "文章"
      url = "/posts/"

      [[languages.zh-cn.params.homeInfoParams.Buttons]]
      name = "GitHub"
      url = "https://github.com/kele0808"

    [languages.zh-cn.params.footer]
    text = '[GitHub](https://github.com/kele0808) · [RSS](/keleBlog/index.xml)'

  [[languages.zh-cn.menu.main]]
  identifier = "posts"
  name = "文章"
  pageRef = "/posts"
  weight = 10

  [[languages.zh-cn.menu.main]]
  identifier = "series"
  name = "系列"
  pageRef = "/series"
  weight = 20

  [[languages.zh-cn.menu.main]]
  identifier = "knowledge"
  name = "知识"
  pageRef = "/knowledge"
  weight = 25

  [[languages.zh-cn.menu.main]]
  identifier = "projects"
  name = "项目"
  pageRef = "/projects"
  weight = 30

  [[languages.zh-cn.menu.main]]
  identifier = "about"
  name = "关于"
  pageRef = "/about"
  weight = 40

# ---------- 输出与渲染 ----------
[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['$$', '$$'], ['\[', '\]']]
inline = [['\(', '\)']]

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2
