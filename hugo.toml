baseURL = "https://<GITHUB_USERNAME>.github.io/keleBlog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "keleBlog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "keleBlog"
description = "学习笔记与技术博客 —— Kafka、AI 与后端那些事"
keywords = ["Blog", "Kafka", "AI", "后端", "源码解析"]
author = "kele"
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.homeInfoParams]
Title = "Hi, 我是 kele 👋"
Content = "这里是我的学习笔记与技术博客。主要会写 Kafka 源码解析、后端架构、AI 相关的知识与思考。慢慢更新，欢迎交流。"

[[params.socialIcons]]
name = "github"
url = "https://github.com/<GITHUB_USERNAME>"

[[params.socialIcons]]
name = "rss"
url = "index.xml"

[params.assets]
disableHLJS = true
favicon = "/favicon.ico"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 20

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 30

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 40

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 50

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 4
ordered = false
startLevel = 2
