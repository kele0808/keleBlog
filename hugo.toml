baseURL = "https://kele0808.github.io/keleBlog/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "keleBlog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

# ---------- 语言无关的全局参数 ----------
[params]
env = "production"
author = "kele"
mainSections = ["posts"]
keywords = ["Blog", "Kafka", "AI", "后端", "源码解析"]
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = true
comments = false
hidemeta = false
hideSummary = false
ShowToc = true
TocOpen = true

[[params.socialIcons]]
name = "github"
url = "https://github.com/kele0808"

[params.assets]
disableHLJS = true
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"
safari_pinned_tab = "safari-pinned-tab.svg"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

# ---------- 多语言配置 ----------
[languages]

# ========== 中文（默认） ==========
[languages.zh-cn]
languageName = "中文"
languageCode = "zh-cn"
weight = 1
title = "keleBlog"

  [languages.zh-cn.params]
  description = "学习笔记与技术博客 —— Kafka、AI 与后端那些事"

    [languages.zh-cn.params.homeInfoParams]
    Title = "Hi, 我是 kele 👋"
    Content = "这里是我的学习笔记与技术博客。主要会写 Kafka 源码解析、后端架构、AI 相关的知识与思考。慢慢更新，欢迎交流。"
    WritingNow = "Kafka 源码解析 · 开篇已发布，Producer 全流程写作中"

    [languages.zh-cn.params.footer]
    text = '本站总访问 <span id="busuanzi_container_site_pv"><span id="busuanzi_value_site_pv">…</span></span> 次 · 总访客 <span id="busuanzi_container_site_uv"><span id="busuanzi_value_site_uv">…</span></span> 人'

    [languages.zh-cn.params.homeSections]
    featuredTitle = "精选文章"
    latestTitle = "最新文章"
    latestMore = "全部文章"
    seriesTitle = "系列"

  [[languages.zh-cn.menu.main]]
  identifier = "posts"
  name = "文章"
  pageRef = "/posts"
  weight = 10

  [[languages.zh-cn.menu.main]]
  identifier = "series"
  name = "系列"
  pageRef = "/series"
  weight = 15

  [[languages.zh-cn.menu.main]]
  identifier = "categories"
  name = "分类"
  pageRef = "/categories"
  weight = 20

  [[languages.zh-cn.menu.main]]
  identifier = "tags"
  name = "标签"
  pageRef = "/tags"
  weight = 30

  [[languages.zh-cn.menu.main]]
  identifier = "archives"
  name = "归档"
  pageRef = "/archives"
  weight = 40

  [[languages.zh-cn.menu.main]]
  identifier = "about"
  name = "关于我"
  pageRef = "/about"
  weight = 60

# ========== 英文 ==========
[languages.en]
languageName = "English"
languageCode = "en"
weight = 2
title = "keleBlog"

  [languages.en.params]
  description = "Study notes & technical blog — Kafka, AI, and backend engineering."

    [languages.en.params.homeInfoParams]
    Title = "Hi, I'm kele 👋"
    Content = "This is my personal blog for study notes and technical writing. Mostly Kafka source-code analysis, backend architecture, and AI-related knowledge. Updates as I learn — feel free to reach out."
    WritingNow = "Kafka source series · Intro published; Producer deep-dive in progress"

    [languages.en.params.footer]
    text = 'Site views: <span id="busuanzi_container_site_pv"><span id="busuanzi_value_site_pv">…</span></span> · Unique visitors: <span id="busuanzi_container_site_uv"><span id="busuanzi_value_site_uv">…</span></span>'

    [languages.en.params.homeSections]
    featuredTitle = "Featured"
    latestTitle = "Latest"
    latestMore = "All posts"
    seriesTitle = "Series"

  [[languages.en.menu.main]]
  identifier = "posts"
  name = "Posts"
  pageRef = "/posts"
  weight = 10

  [[languages.en.menu.main]]
  identifier = "series"
  name = "Series"
  pageRef = "/series"
  weight = 15

  [[languages.en.menu.main]]
  identifier = "categories"
  name = "Categories"
  pageRef = "/categories"
  weight = 20

  [[languages.en.menu.main]]
  identifier = "tags"
  name = "Tags"
  pageRef = "/tags"
  weight = 30

  [[languages.en.menu.main]]
  identifier = "archives"
  name = "Archives"
  pageRef = "/archives"
  weight = 40

  [[languages.en.menu.main]]
  identifier = "about"
  name = "About"
  pageRef = "/about"
  weight = 60

# ---------- 输出与渲染 ----------
[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2
