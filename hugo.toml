baseURL = "https://kele0808.github.io/keleBlog/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "keleBlog"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pagination.pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

# ---------- 语言无关的全局参数 ----------
[params]
env = "production"
author = "kele"
mainSections = ["posts"]
keywords = ["Blog", "Kafka", "AI", "后端", "源码解析"]
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = false
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
ShowToc = true
TocOpen = true

[[params.socialIcons]]
name = "github"
url = "https://github.com/kele0808"

[[params.socialIcons]]
name = "rss"
url = "index.xml"

[params.assets]
disableHLJS = true
favicon = "favicon.svg"
favicon16x16 = "favicon-16x16.png"
favicon32x32 = "favicon-32x32.png"
apple_touch_icon = "apple-touch-icon.png"
safari_pinned_tab = "safari-pinned-tab.svg"

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

# ---------- 多语言配置 ----------
[languages]

# ========== 中文（默认） ==========
[languages.zh-cn]
languageName = "中文"
languageCode = "zh-cn"
weight = 1
title = "keleBlog"

  [languages.zh-cn.params]
  description = "学习笔记与技术博客 —— Kafka、AI 与后端那些事"

    [languages.zh-cn.params.homeInfoParams]
    Title = "Hi, 我是 kele 👋"
    Content = "这里是我的学习笔记与技术博客。主要会写 Kafka 源码解析、后端架构、AI 相关的知识与思考。慢慢更新，欢迎交流。"

  [[languages.zh-cn.menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

  [[languages.zh-cn.menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20

  [[languages.zh-cn.menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

  [[languages.zh-cn.menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 40

  [[languages.zh-cn.menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 50

# ========== 英文 ==========
[languages.en]
languageName = "English"
languageCode = "en"
weight = 2
title = "keleBlog"

  [languages.en.params]
  description = "Study notes & technical blog — Kafka, AI, and backend engineering."

    [languages.en.params.homeInfoParams]
    Title = "Hi, I'm kele 👋"
    Content = "This is my personal blog for study notes and technical writing. Mostly Kafka source-code analysis, backend architecture, and AI-related knowledge. Updates as I learn — feel free to reach out."

  [[languages.en.menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/en/posts/"
  weight = 10

  [[languages.en.menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/en/categories/"
  weight = 20

  [[languages.en.menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/en/tags/"
  weight = 30

  [[languages.en.menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/en/archives/"
  weight = 40

  [[languages.en.menu.main]]
  identifier = "search"
  name = "Search"
  url = "/en/search/"
  weight = 50

# ---------- 输出与渲染 ----------
[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = true
style = "monokai"
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2
