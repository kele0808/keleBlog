# Projects 页数据。group 决定分组，featured 决定是否上首页。
# 文章 front matter 写 project: <id> 即可在文末关联项目。
# done / todo 只写能在仓库 README 或代码中核实的内容；verified 为最近一次核验日期。
groups:
  - id: ai
    name: AI / Agent
  - id: backend
    name: 后端 / 基础设施

items:
  - id: ragforge
    name: RAGForge
    group: ai
    featured: true
    kind: 原创
    status: 进行中 · Step 5 / 12
    tagline: 进行中的 RAG 工程实践：在 PostgreSQL 里做混合检索
    problem: 只用 PostgreSQL + pgvector，一步步搭出可演进的 RAG，把检索、融合、权限与评测的取舍讲清楚。
    role: 编写 12 步实施 spec，按步实现并为每一步配测试；对照 RAGFlow 做取舍，不照抄。
    done:
      - Markdown 切块入库（LlamaIndex）
      - pgvector 向量检索 + 生成
      - PostgreSQL 全文检索 + RRF 融合
    todo:
      - 按 owner 的 ACL
      - Cross-encoder rerank
      - 结构化引用
      - FastAPI 接口
      - PDF / DOCX 解析
      - 小型自评测（Recall@k / MRR@k）
    stack: [Python, PostgreSQL, pgvector, LlamaIndex]
    github: https://github.com/kele0808/RAGForge
    verified: "2026-09-29"

  - id: daily-learnable
    name: daily-learnable
    group: ai
    featured: true
    kind: 原创
    status: 每周更新
    tagline: 学习情报自动化：每周筛选值得研究的 Agent / MCP 开源项目
    problem: GitHub 上 Agent / MCP 项目太多，按 star 排序会混进空壳和刷星项目，需要一个每周固定产出的筛选流程。
    role: 设计筛选规则与 Agent 工作流，搭建按日期浏览 digest 的 Next.js 页面。
    done:
      - 每周一由 Cursor Automation 搜索 GitHub 上的 Agent / MCP / coding-agent 仓库
      - Agent 逐个阅读 README 与近期提交，剔除空壳项目，保留 3–5 个
      - 结果写入 digests/ 并以 PR 提交，由我合并
      - Next.js 页面按日期浏览历史 digest
    boundary: Digest 是 Agent 的阅读结论，只作学习线索；GitHub Actions 中的手动 workflow 是不经审核的兜底路径。
    stack: [TypeScript, Next.js, Cursor Automation]
    github: https://github.com/kele0808/daily-learnable
    verified: "2026-09-29"

  - id: text2sql
    name: text2sql
    group: ai
    featured: true
    kind: 原创
    status: 实现中 · 01 基础设施已完成
    tagline: 生产级 Text2SQL Agent：用元数据和语义层约束 LLM，而不是直接让模型写 SQL
    problem: 让业务人员用自然语言查 MySQL，同时保证结果口径一致、SQL 只读可控、权限与租户隔离可审计，并能用评测集量化准确率。
    role: 编写架构设计并拆成 9 份子 spec（基础设施、元数据、评测、Join 图、语义层、IR 编译器、执行网关、Agent、交付），严格按 spec 与 TDD 计划实现。
    done:
      - 架构设计文档与 9 份子 spec（已确认）
      - 01 foundation 实施计划（11 个 TDD 任务）
      - 项目骨架：uv + Python 3.12，ruff / mypy strict / pytest
      - 01 基础设施：配置、JSON 日志与 trace_id、FastAPI 骨架与统一错误、/healthz 与 /readyz、Alembic 迁移、PG 任务队列（SKIP LOCKED + 租约）与 worker、只读业务库连接、LangGraph echo 图（57 个单元测试 + 30 个集成测试）
    todo:
      - 02 元数据采集与 04 Join 图
      - 05 语义层与 06 IR → SQL 编译（SQLGlot）
      - 07 只读执行网关与权限
      - 08 LangGraph Agent 与 09 交付
      - 03 合成工单库评测集
    stack: [Python, LangGraph, FastAPI, SQLGlot, PostgreSQL, pgvector, MySQL]
    github: https://github.com/kele0808/text2sql
    verified: "2026-11-21"

