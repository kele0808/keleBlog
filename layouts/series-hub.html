{{- define "main" }}

<header class="page-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- if .Description }}
  <div class="post-description">{{ .Description }}</div>
  {{- end }}
</header>

{{- if .Content }}
<div class="post-content md-content">
  {{ .Content }}
</div>
{{- end }}

{{- partial "series_list.html" . }}

{{- end }}
